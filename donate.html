<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>捐赠信息 - 墨染荷韵的中 V Bot</title>
<link rel="stylesheet" href="style.css">
    <link rel='preconnect' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=ZCOOL+KuaiLe&family=LXGW+WenKai+SC:wght@400;700&display=swap'>
<style>
.donation-summary { background:var(--glass); border:1px solid var(--glass-bd); backdrop-filter:blur(16px); border-radius:var(--radius); padding:20px; margin-bottom:22px; display:flex; justify-content:space-around; flex-wrap:wrap; gap:15px; }
.summary-item { text-align:center; }
.summary-item .number { font-family:var(--mono); font-size:28px; font-weight:800; color:var(--cyan-deep); }
.summary-item .label { font-size:14px; color:var(--muted); margin-top:4px; }
.vc-donate-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
.donation-card { background:var(--glass); border:1px solid var(--glass-bd); border-radius:14px; padding:18px; box-shadow:var(--shadow); }
.donation-card .amount { font-family:var(--mono); font-size:22px; font-weight:800; color:#e65100; margin-bottom:6px; }
.donation-card .donor { font-size:16px; font-weight:700; color:var(--cyan-ink); margin-bottom:4px; }
.donation-card .donor .anonymous { color:#999; font-style:italic; }
.donation-card .message { color:var(--muted); margin:6px 0; font-size:14px; }
.donation-card .date { font-family:var(--mono); font-size:12px; color:var(--muted); }
.donation-card .tags { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
.donation-card .tag { font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(102,204,255,.18); color:var(--cyan-deep); }
.empty-state { text-align:center; padding:40px 0; color:var(--muted); }
.empty-state .icon { font-size:40px; }
.donation-pagination { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; justify-content:center; }
.donation-pagination button { font-family:var(--mono); min-width:38px; padding:8px 12px; border-radius:10px; background:var(--glass); border:1px solid var(--glass-bd); color:var(--cyan-deep); cursor:pointer; font-weight:700; transition:all .2s; }
.donation-pagination button:hover { background:rgba(102,204,255,.25); }
.donation-pagination button.active { background:linear-gradient(135deg,var(--cyan-deep),var(--cyan)); color:#fff; border-color:transparent; }
.loading { color:var(--muted); font-size:14px; }
.err-box { background:var(--glass); border:1px solid var(--glass-bd); border-radius:14px; padding:18px; color:var(--muted); }
.error-state{background:var(--glass);border:1px solid var(--glass-bd);border-radius:14px;padding:18px;color:var(--muted);}

.vc-sec{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-bd);border-radius:var(--radius);padding:22px 24px;margin-bottom:24px;box-shadow:var(--shadow);}

.vc-fly,.vc-flyr,.vc-zoom,.vc-up,.vc-up.d1,.vc-up.d2,.vc-up.d3,.vc-up.d4{opacity:1 !important;transform:none !important;transition:none !important;}
</style>
</head>
<body>
<div class="vc-bg"><div class="vc-aurora vc-a1"></div><div class="vc-aurora vc-a2"></div><div class="vc-aurora vc-a3"></div><div class="vc-grid"></div></div>
<div class="vc-bgimg"></div>
<div class="vc-top" id="vcTop"><div class="logo" id="vcLogo">墨染<b>荷韵</b> · 中V Bot</div><nav><a href="index.html">← 返回主页</a></nav></div>
<main class="vc-wrap">
<header class="vc-hero-banner">
<div class="vc-kicker"><span>SUPPORT US</span><span>DONATION</span></div>
<h1 class="vc-title vc-zoom">💰 捐赠信息</h1>
<p class="vc-sub vc-fly d1">感谢每一位支持者的慷慨赞助 ♥ 数据来自 donate.txt，不定期更新。</p>
</header>


<section class="vc-sec">
<div class="vc-sechead"><span class="vc-secnum">01</span><h2 class="vc-sectitle">月度统计</h2><span class="vc-seclatin">MONTHLY</span></div>
<div id="monthly-container"><p class="loading">加载中...</p></div>
</section>

<section class="vc-sec">
<div class="vc-sechead"><span class="vc-secnum">02</span><h2 class="vc-sectitle">捐赠列表</h2><span class="vc-seclatin">RECORDS</span></div>
<div id="donation-container"><p class="loading">加载中...</p></div>
</section>

<footer class="vc-foot">
<p>墨染荷韵 中V Bot | 数据不定期更新</p>
<p><a href="index.html" class="vc-chip">返回主页</a></p>
</footer>
</main>
<script>
        // ===== 工具函数 =====
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ===== 解析捐赠数据 =====
        function parseDonateData(text) {
            const entries = [];
            const blocks = text.trim().split(/\n\s*\n/);
            for (const block of blocks) {
                const lines = block.trim().split('\n');
                const entry = {};
                for (const line of lines) {
                    if (line.startsWith('金额：')) {
                        entry.amount = line.replace('金额：', '').trim();
                    } else if (line.startsWith('赞助方：')) {
                        entry.donor = line.replace('赞助方：', '').trim();
                    } else if (line.startsWith('留言：')) {
                        entry.message = line.replace('留言：', '').trim();
                    } else if (line.startsWith('时间：')) {
                        entry.time = line.replace('时间：', '').trim();
                    } else if (line.startsWith('单号（后 6 位）：')) {
                        entry.orderId = line.replace('单号（后 6 位）：', '').trim();
                    }
                }
                if (entry.amount) {
                    const numStr = entry.amount.replace(/[^0-9.]/g, '');
                    entry.amountNum = parseFloat(numStr) || 0;
                    if (entry.time) {
                        const match = entry.time.match(/(\d{4})年(\d{1,2})月/);
                        if (match) {
                            entry.monthKey = match[1] + '-' + match[2].padStart(2, '0');
                        } else {
                            entry.monthKey = 'unknown';
                        }
                    } else {
                        entry.monthKey = 'unknown';
                    }
                    entries.push(entry);
                }
            }
            return entries;
        }

        // ===== 渲染月度统计表 =====
        function renderMonthlyTable(entries) {
			const expenseMap = {
			'2026-02': 66.31,
			'2026-03': 86.32,
			'2026-04': 44.97,
			'2026-05': 187.69,
			'2026-06': 92.90,
			'2026-07': 349.89,
			'2026-08': 98.91
			}
        
            const container = document.getElementById('monthly-container');

            if (!entries || entries.length === 0) {
                container.innerHTML = '<div class="monthly-empty">暂无数据</div>';
                return;
            }

            const monthMap = {};
            entries.forEach(e => {
                const key = e.monthKey || 'unknown';
                if (!monthMap[key]) { monthMap[key] = { income: 0, count: 0 }; }
                monthMap[key].income += e.amountNum;
                monthMap[key].count += 1;
            });
            
            const allMonths = new Set([
                ...Object.keys(monthMap).filter(k => k !== 'unknown'),
                ...Object.keys(expenseMap)
            ]);
            const monthArr = Array.from(allMonths).sort((a, b) => b.localeCompare(a));

            if (monthArr.length === 0) {
                container.innerHTML = '<div class="monthly-empty">无法解析月份信息</div>';
                return;
            }

            let totalIncome = 0;
            let totalCount = 0;
            let totalExpense = 0;
            monthArr.forEach(k => {
                totalIncome += monthMap[k] ? monthMap[k].income : 0;
                totalCount += monthMap[k] ? monthMap[k].count : 0;
                totalExpense += expenseMap[k] || 0;
            });

            let html = '<div class="monthly-table-wrap"><table class="monthly-table">';
            html += `
                <thead>
                    <tr>
                        <th>月份</th>
                        <th>条数</th>
                        <th>捐赠（元）</th>
                        <th>支出（元）</th>
                    </tr>
                </thead>
                <tbody>
            `;

            monthArr.forEach(k => {
                const data = monthMap[k];
                const parts = k.split('-');
                const displayMonth = parts[0] + '年' + parseInt(parts[1]) + '月';
                html += `
                    <tr>
                        <td>${displayMonth}</td>
                        <td>${data.count}</td>
                        <td class="income">${data.income.toFixed(2)}</td>
                        <td class="expense">${expenseMap[k] ? expenseMap[k].toFixed(2) : '0.00'}</td>
                    </tr>
                `;
            });

            html += `
                    <tr class="total-row">
                        <td>📍 合计</td>
                        <td>${totalCount}</td>
                        <td class="income">${totalIncome.toFixed(2)}</td>
                        <td class="expense">${totalExpense.toFixed(2)}</td>
                    </tr>
                </tbody>
            `;
            html += '</table>';
            html += '<p style="text-align:right; font-size:13px; color:#999; margin-top:6px;">💡 支出数据不定期填写，这里只统计api支出，不包含服务器开销</p>';
            html += '</div>';

            container.innerHTML = html;
        }

        // ===== 分页渲染捐赠列表 =====
        const PAGE_SIZE = 10;
        let currentPage = 1;
        let allEntries = [];

        function renderDonationPage(page) {
            const container = document.getElementById('donation-container');

            if (!allEntries || allEntries.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>暂无捐赠记录</p>
                    </div>
                `;
                return;
            }

            const totalPages = Math.ceil(allEntries.length / PAGE_SIZE);
            const validPage = Math.max(1, Math.min(page, totalPages));
            currentPage = validPage;

            const start = (validPage - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, allEntries.length);
            const pageEntries = allEntries.slice(start, end);

            let totalAmount = 0;
            allEntries.forEach(e => { totalAmount += e.amountNum; });

            let html = `
                <div class="donation-summary">
                    <div class="summary-item">
                        <div class="number">${allEntries.length}</div>
                        <div class="label">♥ 总捐赠人次</div>
                    </div>
                    <div class="summary-item">
                        <div class="number">${totalAmount.toFixed(2)}</div>
                        <div class="label">💰 金额合计（元）</div>
                    </div>
                </div>
            `;

            pageEntries.forEach(entry => {
                const isAnonymous = !entry.donor || entry.donor === '（未署名）' || entry.donor === '';
                const donorDisplay = isAnonymous
                    ? '<span class="anonymous">（未署名）</span>'
                    : escapeHtml(entry.donor);
                const messageDisplay = (entry.message && entry.message !== '无' && entry.message !== '')
                    ? `<div class="message">💬 ${escapeHtml(entry.message)}</div>`
                    : '';

                html += `
                    <div class="donation-card">
                        <div class="amount">💰 ${escapeHtml(entry.amount)}</div>
                        <div class="donor">${donorDisplay}</div>
                        ${messageDisplay}
                        <div class="meta">
                            <span>🕐 ${escapeHtml(entry.time || '未知')}</span>
                            <span class="order-id">#${escapeHtml(entry.orderId || '------')}</span>
                        </div>
                    </div>
                `;
            });

            html += buildPagination(totalPages, validPage);
            container.innerHTML = html;

            document.querySelectorAll('.page-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const p = parseInt(this.dataset.page);
                    if (p && p !== currentPage) {
                        renderDonationPage(p);
                        window.scrollTo({ top: document.getElementById('donation-container').offsetTop - 20, behavior: 'smooth' });
                    }
                });
            });
            document.querySelectorAll('.page-nav').forEach(btn => {
                btn.addEventListener('click', function() {
                    const p = parseInt(this.dataset.page);
                    if (p) {
                        renderDonationPage(p);
                        window.scrollTo({ top: document.getElementById('donation-container').offsetTop - 20, behavior: 'smooth' });
                    }
                });
            });
        }

        function buildPagination(totalPages, current) {
            if (totalPages <= 1) return '';
            let html = '<div class="pagination">';
            html += `<button class="page-nav" data-page="${current - 1}" ${current <= 1 ? 'disabled' : ''}>‹ 上一页</button>`;

            const vw = window.innerWidth || 800; let maxVisible = vw < 560 ? 3 : (vw < 900 ? 5 : 7);
            let startP = Math.max(1, current - Math.floor(maxVisible / 2));
            let endP = Math.min(totalPages, startP + maxVisible - 1);
            if (endP - startP + 1 < maxVisible) {
                startP = Math.max(1, endP - maxVisible + 1);
            }

            if (startP > 1) {
                html += `<button class="page-btn" data-page="1">1</button>`;
                if (startP > 2) html += `<span class="page-info">…</span>`;
            }

            for (let i = startP; i <= endP; i++) {
                html += `<button class="page-btn ${i === current ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }

            if (endP < totalPages) {
                if (endP < totalPages - 1) html += `<span class="page-info">…</span>`;
                html += `<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
            }

            html += `<button class="page-nav" data-page="${current + 1}" ${current >= totalPages ? 'disabled' : ''}>下一页 ›</button>`;
            html += '</div>';
            return html;
        }

        // ===== 加载数据 =====
        (function loadDonateData() {
            const donationContainer = document.getElementById('donation-container');
            const monthlyContainer = document.getElementById('monthly-container');

            fetch('donate.txt')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('无法加载 donate.txt (HTTP ' + response.status + ')')
                    }
                    return response.text();
                })
                .then(data => {
                    allEntries = parseDonateData(data);
                    renderMonthlyTable(allEntries);
                    renderDonationPage(1);
        window.addEventListener('resize', function(){ renderDonationPage(currentPage); });
                })
                .catch(err => {
                    console.error('加载捐赠数据失败:', err);
                    const errHtml = `
                        <div class="error-state">
                            <strong>❌ 加载失败</strong>
                            <p style="margin-top:10px;color:#555;">${escapeHtml(err.message)}</p>
                            <p style="margin-top:8px;color:#888;">请确认 donate.txt 文件与此页面在同一目录下。</p>
                        </div>
                    `;
                    donationContainer.innerHTML = errHtml;
                    monthlyContainer.innerHTML = errHtml;
                });
        })();
    </script>
</body>

</html>
